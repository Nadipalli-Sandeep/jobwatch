name: Refresh career sites

# Once a month, look again for each company's career-site system
# (companies sometimes move to a new one). New sites start silently.
on:
  schedule:
    - cron: "30 20 1 * *"            # 1st of every month, 02:00 IST
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m jobwatch.discover
      - name: Commit if changed
        run: |
          git config user.name "jobwatch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sources.json
          git diff --cached --quiet || { git commit -m "Refresh career sites"; git push; }
